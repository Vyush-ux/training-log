<style>
  :root{
    --bg: #0e2032;
    --bg-alt: #14293d;
    --panel: rgba(24, 42, 62, 0.72);
    --panel-line: rgba(255, 233, 168, 0.18);
    --cobalt: #4a63ff;
    --cobalt-dim: #2c3570;
    --amber: #ffb020;
    --moss: #48c78e;
    --danger: #e5484d;
    --text: #eceef7;
    --text-dim: #9297b0;
    --text-faint: #7c88a0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height: 100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* OCEAN SCENE BACKGROUND */
  .bg-scene{
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    transition: background 1.2s ease;
  }
  body.theme-night .bg-scene{
    background: linear-gradient(180deg, #0b1a2e 0%, #0e2440 35%, #123457 65%, #0a5f66 100%);
  }
  body.theme-day .bg-scene{
    background: linear-gradient(180deg, #7fd6f4 0%, #74c9e6 30%, #4bb1c9 60%, #1f8fa6 100%);
  }
  body.theme-day .bg-stars,
  body.theme-day .bg-moon,
  body.theme-day .bg-astro,
  body.theme-day .bg-rocket,
  body.theme-day .bg-planet,
  body.theme-day .bg-orbit,
  body.theme-day .bg-constellation{ display: none; }
  body.theme-night .bg-sun,
  body.theme-night .bg-clouds{ display: none; }
  body.theme-day .bg-islands{ filter: brightness(1.7) saturate(1.3) hue-rotate(-12deg); opacity: 0.7; }
  body.theme-day .bg-waves{ filter: brightness(2.1) saturate(1.15); }
  body.theme-day .bg-waves.back{ filter: brightness(1.7) saturate(1.1); }
  body.theme-day .bg-compass{ opacity: 0.16; filter: brightness(0.7) saturate(1.2); }

  .theme-toggle{
    position: fixed; top: 16px; right: 16px; z-index: 5;
    display:flex; align-items:center; gap: 6px;
    background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
    font-family:'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); user-select: none;
  }
  .theme-toggle:hover{ color: var(--text); }
  .bg-stars{ position:absolute; top:0; left:0; width:100%; height:45%;
    background-image:
      radial-gradient(2px 2px at 10% 15%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 25% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 60% 22%, rgba(255,255,255,0.5), transparent),

  .wrap{ max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }

  .eyebrow{

    font-size: 13px; color: var(--amber);
    display:flex; align-items:center; gap: 5px;

  .xp-track{

  .xp-fill{
    height:100%; border-radius: 6px;

  .xp-label{ font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); margin-top: 5px; }

  /* ARC TIMELINE */
  .section-title{
    font-family:'Bebas Neue', sans-serif;

  .section-title .count{

  .arc-strip{

  .arc-node{

<script>
const STATE_KEY = 'training-log-state';
const THEME_KEY = 'theme-mode-pref';
let themeMode = 'auto';

function computeAutoTheme(){
  const h = new Date().getHours();
  return (h >= 6 && h < 19) ? 'day' : 'night';
}

function applyTheme(){
  const active = themeMode === 'auto' ? computeAutoTheme() : themeMode;
  document.body.classList.remove('theme-day', 'theme-night');
  document.body.classList.add('theme-' + active);
  const labelMap = { auto: '☀︎/☾ auto', day: '☀︎ day', night: '☾ night' };
  document.getElementById('themeToggle').textContent = labelMap[themeMode];
}

async function loadTheme(){
  try{
    const res = await window.storage.get(THEME_KEY, false);
    if(res && res.value) themeMode = res.value;
  } catch(e){ /* default to auto */ }
  applyTheme();
}

async function cycleTheme(){
  const order = ['auto', 'day', 'night'];
  themeMode = order[(order.indexOf(themeMode) + 1) % order.length];
  applyTheme();
  try{ await window.storage.set(THEME_KEY, themeMode, false); } catch(e){}
}

document.getElementById('themeToggle').addEventListener('click', cycleTheme);
loadTheme();
setInterval(() => { if(themeMode === 'auto') applyTheme(); }, 5 * 60 * 1000);


const CATS = {
  strength: {label:'Strength', color:'#e5484d'},
  endurance: {label:'Endurance', color:'#48c78e'},
  speed: {label:'Speed', color:'#4a63ff'},
  flex: {label:'Flexibility', color:'#ffb020'}
};
const ARC_COUNT = 10;
const DAYS_PER_ARC = 30;

let state = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    startDate: todayStr(),
    lastActiveDate: todayStr(),
    totalXP: 0,
    streak: 0,
    stats: { strength: 0, endurance: 0, speed: 0, flex: 0 },
    questTemplates: [
      {id: 'q1', text: '50 push-ups', cat: 'strength', xp: 15},
      {id: 'q2', text: '20 min run', cat: 'endurance', xp: 15},
      {id: 'q3', text: '10 min stretch', cat: 'flex', xp: 10}
    ],
    completedToday: [],
    completedDate: todayStr(),
    logs: []
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(STATE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
    } else {
      state = defaultState();
      await saveState();
    }
  } catch(e){
    state = defaultState();
    await saveState();
  }
  rolloverDay();
  render();
}

async function saveState(){
  try{
    await window.storage.set(STATE_KEY, JSON.stringify(state), false);
  } catch(e){ console.error('save failed', e); }
}

function daysBetween(a, b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}

function rolloverDay(){
  const today = todayStr();
  if(state.completedDate !== today){
    // check streak: did yesterday have any completions?
    const gap = daysBetween(state.completedDate, today);
    if(gap === 1 && state.completedToday.length > 0){
      state.streak += 1;
    } else if(gap > 1 || state.completedToday.length === 0){
      state.streak = 0;
    }
    state.completedToday = [];
    state.completedDate = today;
  }
  state.lastActiveDate = today;
}

function levelFromXP(xp){
  const level = Math.floor(xp / 100) + 1;
  const into = xp % 100;
  return {level, into};
}

function statLevel(xp){
  return Math.floor(xp / 50) + 1;
}

function render(){
  const dayNum = daysBetween(state.startDate, todayStr()) + 1;
  document.getElementById('dayCount').innerHTML = dayNum + '<span>DAY</span>';

  const {level, into} = levelFromXP(state.totalXP);
  document.getElementById('levelBadge').textContent = 'LV. ' + level;
  document.getElementById('xpFill').style.width = into + '%';
  document.getElementById('xpLabel').textContent = into + ' / 100 XP · ' + state.totalXP + ' total';
  document.getElementById('streakBadge').textContent = '🔥 ' + state.streak + ' day streak';
  document.getElementById('startNote').textContent = 'Started ' + state.startDate;

  // Arc strip
  const currentArc = Math.min(ARC_COUNT, Math.floor((dayNum - 1) / DAYS_PER_ARC) + 1);
  document.getElementById('arcCount').textContent = 'Month ' + currentArc + ' of ' + ARC_COUNT;
  const arcStrip = document.getElementById('arcStrip');
  arcStrip.innerHTML = '';
  for(let i = 1; i <= ARC_COUNT; i++){
    if(i > 1){
      const rope = document.createElement('div');
      rope.className = 'arc-rope';
      arcStrip.appendChild(rope);
    }
    const node = document.createElement('div');
    let cls = 'arc-node';
    let mark = '☁️';
    if(i < currentArc){ cls += ' done'; mark = '🏝️'; }
    else if(i === currentArc){ cls += ' active'; mark = '🚩'; }
    node.className = cls;
    node.innerHTML = '<div class="mark">'+mark+'</div><div class="n">M'+i+'</div><div class="lbl">'+(i*DAYS_PER_ARC)+'d</div>';
    arcStrip.appendChild(node);
  }

  // Stats grid
  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = '';
  Object.keys(CATS).forEach(key => {
    const xp = state.stats[key] || 0;
    const lvl = statLevel(xp);
    const into = xp % 50;
    const pct = (into / 50) * 100;
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.style.setProperty('--stat-color', CATS[key].color);
    card.innerHTML = `
      <div class="stat-top">
        <div class="stat-name">${CATS[key].label}</div>
        <div class="stat-lvl">LV ${lvl}</div>
      </div>
      <div class="stat-bar"><div class="stat-fill" style="width:${pct}%"></div></div>
    `;
    statsGrid.appendChild(card);
  });

  // Quests
  const questList = document.getElementById('questList');
  questList.innerHTML = '';
  document.getElementById('questCount').textContent = state.completedToday.length + ' / ' + state.questTemplates.length + ' done';
  if(state.questTemplates.length === 0){
    questList.innerHTML = '<div class="empty">No quests yet — add your first one below.</div>';
  }
  state.questTemplates.forEach(q => {
    const done = state.completedToday.includes(q.id);
    const row = document.createElement('div');
    row.className = 'quest-row';
    row.innerHTML = `
      <div class="quest-check ${done ? 'checked' : ''}" data-id="${q.id}">${done ? '✓' : ''}</div>
      <div class="quest-text ${done ? 'checked' : ''}">${escapeHtml(q.text)}</div>
      <div class="quest-tag">${CATS[q.cat].label}</div>
      <div class="quest-xp">+${q.xp}xp</div>
      <button class="quest-del" data-del="${q.id}">✕</button>
    `;
    questList.appendChild(row);
  });

  // Logs
  const logList = document.getElementById('logList');
  logList.innerHTML = '';
  if(state.logs.length === 0){
    logList.innerHTML = '<div class="empty">Nothing logged yet.</div>';
  } else {
    state.logs.slice().reverse().slice(0, 15).forEach(l => {
      const row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML = `
        <div class="le-main"><span>${escapeHtml(l.exercise)}</span><span class="le-val">${l.value}${escapeHtml(l.unit||'')}</span></div>
        <span class="le-date">${l.date}</span>
      `;
      logList.appendChild(row);
    });
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleQuest(id){
  const q = state.questTemplates.find(x => x.id === id);
  if(!q) return;
  const idx = state.completedToday.indexOf(id);
  if(idx >= 0){
    state.completedToday.splice(idx, 1);
    state.totalXP = Math.max(0, state.totalXP - q.xp);
    state.stats[q.cat] = Math.max(0, (state.stats[q.cat]||0) - q.xp);
  } else {
    state.completedToday.push(id);
    state.totalXP += q.xp;
    state.stats[q.cat] = (state.stats[q.cat]||0) + q.xp;
    if(state.streak === 0 && state.completedToday.length === 1){
      // starting a fresh streak today counts once rollover happens tomorrow;
      // but give immediate feedback by treating today as day 1 of streak visually
    }
  }
  await saveState();
  render();
}

async function deleteQuest(id){
  state.questTemplates = state.questTemplates.filter(q => q.id !== id);
  state.completedToday = state.completedToday.filter(x => x !== id);
  await saveState();
  render();
}

async function addQuest(){
  const input = document.getElementById('questInput');
  const cat = document.getElementById('questCategory').value;
  const text = input.value.trim();
  if(!text) return;
  state.questTemplates.push({id: 'q'+Date.now(), text, cat, xp: 15});
  input.value = '';
  await saveState();
  render();
}

async function addLog(){
  const ex = document.getElementById('logExercise');
  const val = document.getElementById('logValue');
  const unit = document.getElementById('logUnit');
  if(!ex.value.trim() || !val.value) return;
  state.logs.push({
    exercise: ex.value.trim(),
    value: val.value,
    unit: unit.value.trim(),
    date: todayStr()
  });
  ex.value = ''; val.value=''; unit.value='';
  await saveState();
  render();
}

async function resetAll(){
  if(!confirm('This will erase all training progress. Are you sure?')) return;
  state = defaultState();
  await saveState();
  render();
}

document.addEventListener('click', (e) => {
  const check = e.target.closest('.quest-check');
  if(check){ toggleQuest(check.dataset.id); return; }
  const del = e.target.closest('.quest-del');
  if(del){ deleteQuest(del.dataset.del); return; }
});
document.getElementById('addQuestBtn').addEventListener('click', addQuest);
document.getElementById('questInput').addEventListener('keydown', e => { if(e.key==='Enter') addQuest(); });
document.getElementById('addLogBtn').addEventListener('click', addLog);
document.getElementById('resetBtn').addEventListener('click', resetAll);

loadState();
</script>
</body>
</html>
